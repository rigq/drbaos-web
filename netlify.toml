[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Cabeceras ──────────────────────────────────────────────
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# ─── Redirecciones 301 de URLs del sitio anterior ──────────
# force = true: la build genera archivos .html con el mismo nombre
# (p. ej. dist/arges.html) y sin force Netlify los serviría en lugar de redirigir.

[[redirects]]
  from = "/arges.html"
  to = "/arges"
  status = 301
  force = true

